[versions]
version-code = "1"
version-name = "0.1.0"
app-pkg = "com.grappim.deskmate"

#noinspection UnusedVersionCatalogEntry
compileSdk = "37"
#noinspection UnusedVersionCatalogEntry
minSdk = "24"
#noinspection UnusedVersionCatalogEntry
targetSdk = "37"

# https://github.com/detekt/detekt/releases
detekt = "2.0.0-alpha.6"
# https://github.com/JLLeitschuh/ktlint-gradle/releases
ktlint = "14.2.0"
# https://github.com/Kotlin/kotlinx-kover/releases
kover = "0.9.9"
# https://github.com/mrmans0n/compose-rules/releases
composeRules = "0.6.6"

# https://developer.android.com/reference/tools/gradle-api
agp = "9.4.0"
# https://github.com/google/desugar_jdk_libs/blob/master/CHANGELOG.md
androidDesugarJdkLibs = "2.1.5"

# https://github.com/JetBrains/kotlin/releases
kotlin = "2.4.10"
# https://github.com/Kotlin/kotlinx.coroutines/releases
coroutines = "1.11.0"
kotlin-serialization-json = "1.11.0"
# https://github.com/Kotlin/kotlinx.collections.immutable/releases
kotlinx-collections = "0.5.2"
# https://github.com/Kotlin/kotlinx-datetime/releases
kotlin-date-time = "0.8.0"
# https://github.com/cashapp/turbine/releases
turbine = "1.2.1"
ktor = "3.5.2"
# https://developer.android.com/jetpack/androidx/releases/datastore
dataStore = "1.2.1"

# https://github.com/InsertKoinIO/koin/releases
koin-bom = "4.2.2"
# https://github.com/InsertKoinIO/koin-annotations/releases
koin-annotations = "4.2.2"
# https://github.com/InsertKoinIO/koin-compiler-plugin
koin-plugin = "1.2.1"

# https://developer.android.com/jetpack/androidx/releases/activity
activity-compose = "1.13.0"

# https://github.com/JetBrains/compose-multiplatform/releases
jetbrainsComposeMultiplatform = "1.12.0"
jetbrainsNavigationEvent = "1.1.0"
jetbrainsComposeMaterial3 = "1.10.0-alpha05"
jetbrainsSavedState = "1.4.0"
jetbrainsComposeIcons = "1.7.3"
jetbrainsAndroidxLifecycle = "2.11.0"
# https://developer.android.com/guide/navigation/navigation-3
jetbrainsNav3 = "1.1.1"
# https://github.com/JakeWharton/timber/releases
timber = "5.0.1"
# https://github.com/Grigoriym/grappim-kit — one shared VERSION_NAME for every wired module
grappimKit = "0.1.7"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }

jetbrains-compose-navigationevent = { module = "org.jetbrains.androidx.navigationevent:navigationevent-compose", version.ref = "jetbrainsNavigationEvent" }
jetbrains-compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "jetbrainsComposeMaterial3" }
jetbrains-compose-icons = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "jetbrainsComposeIcons" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsAndroidxLifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsAndroidxLifecycle" }
jetbrains-lifecycle-viewmodelNavigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "jetbrainsAndroidxLifecycle" }
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jetbrainsNav3" }
jetbrains-androidx-savedstate = { module = "org.jetbrains.androidx.savedstate:savedstate", version.ref = "jetbrainsSavedState" }

grappim-kit-logger = { module = "io.github.grigoriym:grappim-kit-logger", version.ref = "grappimKit" }
grappim-kit-uikit = { module = "io.github.grigoriym:grappim-kit-uikit", version.ref = "grappimKit" }
grappim-kit-testing = { module = "io.github.grigoriym:grappim-kit-testing", version.ref = "grappimKit" }

timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serialization-json" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinx-collections" }
kotlinx-date-time = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlin-date-time" }

ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }

androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "dataStore" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "dataStore" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-core-viewmodel = { module = "io.insert-koin:koin-core-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-test = { module = "io.insert-koin:koin-test" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koin-annotations" }

android-desugarJdkLibs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "androidDesugarJdkLibs" }

turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

composeRules-ktlint = { module = "io.nlopez.compose.rules:ktlint", version.ref = "composeRules" }
composeRules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRules" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
compose-multiplatform-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "jetbrainsComposeMultiplatform" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

jetbrains-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrainsComposeMultiplatform" }
jetbrains-kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }

# Plugins defined in the included build-logic
deskmate-kmp-serialization = { id = "deskmate.kmp.serialization" }
deskmate-kmp-di = { id = "deskmate.kmp.di" }
deskmate-kmp-network = { id = "deskmate.kmp.network" }
deskmate-kmp-library = { id = "deskmate.kmp.library" }
deskmate-kmp-library-compose = { id = "deskmate.kmp.library.compose" }
deskmate-kmp-library-stability = { id = "deskmate.kmp.library.stability" }
deskmate-android-application = { id = "deskmate.android.application" }
